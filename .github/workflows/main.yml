name: Build and Upload V2IpLimit

on:
  push:
    paths:
      - "v2iplimit.py"
      - "run_telegram.py"
      - "telegram_bot/**"
      - "utils/**"
      - "requirements.txt"
      - "build_requirements.txt"
      - "v2iplimit.sh"
      - ".github/workflows/main.yml"
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update, for example 1.0.7"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: v2iplimit_amd64_linux.bin
          - os: ubuntu-22.04-arm
            asset_name: v2iplimit_arm64_linux.bin
          - os: windows-latest
            asset_name: v2iplimit_amd64_windows.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install your Dependencies
        run: |
          pip install -r build_requirements.txt
      - name: Build Executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: v2iplimit.py
          mode: app
          include-package: "websockets,httpx,telegram,telegram_bot,utils"
          python-flag: "-OO"
          assume-yes-for-downloads: true
          output-dir: build
          caching-key: nuitka-${{ runner.os }}-${{ runner.arch }}-py-${{ matrix.python-version }}

      - name: Rename release asset
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp build/*.exe "dist/${{ matrix.asset_name }}"
          else
            cp build/*.bin "dist/${{ matrix.asset_name }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/${{ matrix.asset_name }}
